server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # ---------------------------------------------------------------------
    # Dashboard gallery — static catalog generated by gallery/build.mjs.
    # The host folder gallery/site is mounted read-only at /site.
    # ---------------------------------------------------------------------
    location /gallery/ {
        alias /site/;
        index index.html;
    }

    # Scene files. They must go out as application/json so Excalidraw can
    # fetch() them for the /#url=/scenes/<name>.excalidraw deep link.
    location /scenes/ {
        alias /site/scenes/;
        default_type application/json;
        add_header X-Content-Type-Options nosniff;
        add_header Cache-Control "no-cache";
    }

    # ---------------------------------------------------------------------
    # Excalidraw app itself (SPA)
    # ---------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
